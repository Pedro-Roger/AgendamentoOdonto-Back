services:
  postgres:
    image: postgres:16-alpine
    container_name: agendamentoodonto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agendamento_odonto
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # A seção 'ports' foi removida. O banco agora está 100% invisível para a internet.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d agendamento_odonto"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agendamentoodonto-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/agendamento_odonto?schema=public
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      APP_URL: ${APP_URL}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000" # Apenas a porta da API fica acessível publicamente
    command: sh -c "npm run migrate && npx prisma generate && node dist/src/main.js"

volumes:
  postgres_data:
